# LOCAL-PATCH: status strip (update loop)
#
# nginx snippet for /etc/nginx/sites-enabled/crm.impressionphotography.ca.conf
# — add INSIDE the main `server { ... }` block (443 and, if you want it on
# http too, the port-80 block). Serves the CRM build stamp written by
# scripts/publish-crm-version.sh (or by the CI deploy workflow) at
# https://crm.impressionphotography.ca/crm-version.json, which the frontend
# StatusStrip polls (same origin, so no CORS config needed).
#
# Exact-match location wins over the catch-all proxy to the twenty server.
# no-store: the strip polls every 60s and must never see a cached stamp.

location = /crm-version.json {
    default_type application/json;
    alias /opt/crm-version.json;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff";
}
